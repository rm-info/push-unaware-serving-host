# Example: PUSH on its own subdomain.
#
# In the http {} block:
#   limit_req_zone $binary_remote_addr zone=push_register:10m rate=10r/m;
#   limit_req_zone $binary_remote_addr zone=push_request:10m rate=5r/m;

server {
    listen 443 ssl http2;
    server_name push.your-domain;

    ssl_certificate     /etc/letsencrypt/live/push.your-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.your-domain/privkey.pem;

    # Privacy: request lines carry reminder IDs; don't log them.
    access_log off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Admin UI: restrict to your own networks (or use PUSH_ADMIN_LISTEN and
    # don't proxy it at all).
    location /admin/ {
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /v1/subscriptions {
        limit_req zone=push_register burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location /request-key {
        limit_req zone=push_request burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
