# Example: PUSH on its own subdomain, next to PocketBase.
server {
    listen 443 ssl http2;
    server_name push.your-domain;

    ssl_certificate     /etc/letsencrypt/live/push.your-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.your-domain/privkey.pem;

    # Privacy: don't log request lines (they carry reminder IDs).
    access_log off;

    # Light anti-abuse on registration.
    # (declare in http{}: limit_req_zone $binary_remote_addr zone=push_sub:10m rate=10r/m;)
    # location = /v1/subscriptions { limit_req zone=push_sub burst=5; proxy_pass http://127.0.0.1:8080; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
